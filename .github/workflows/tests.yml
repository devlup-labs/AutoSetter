name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # g++ is already on the ubuntu runner, so the pipeline tests -- which
      # compile a real validator, generator, solution and checker against
      # testlib -- run here too rather than skipping.
      - name: Show compiler
        run: g++ --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
