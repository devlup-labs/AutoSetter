[pytest]
testpaths = tests

# The repo root has to be importable, for `utils` and for `tests.cpp_fixtures`.
# `python -m pytest` adds the working directory for you, plain `pytest` does
# not -- which is exactly how this passed locally and failed in CI.
pythonpath = .
# The pipeline's own classes are named TestPipeline / TestReport / TestCase --
# "test" as in the problem's test data, not as in a unit test. Without this,
# pytest tries to collect them and warns about every one.
python_classes = _NeverCollectClasses
addopts = -q
